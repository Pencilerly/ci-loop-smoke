org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true
# This project may live under a path that contains non-ASCII characters (e.g. CJK).
# AGP's default path check refuses such paths on Windows; this override is the
# documented opt-out and lets the project build in place.
android.overridePathCheck=true
