name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

# Cancel superseded runs on the same ref to keep the loop fast.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; OIDC token is requested only for keyless auth to
# Google Cloud (no long-lived service-account JSON key anywhere).
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    outputs:
      # Exposes whether the Google Cloud credentials are configured so the
      # Test Lab job can be skipped until the operator sets the secrets.
      testlab_enabled: ${{ steps.testlab_config.outputs.enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Firebase Test Lab configuration
        id: testlab_config
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "${WIF_PROVIDER}" ] && [ -n "${SA_EMAIL}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Firebase Test Lab credentials detected: Test Lab job will run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Firebase Test Lab secrets not configured; the Test Lab job will be skipped."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Existing JVM unit tests + debug build are kept unchanged (no -x / no skip).
      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

  firebase-test-lab:
    name: Firebase Test Lab (Robo)
    runs-on: ubuntu-latest
    needs: build
    # Run only once the Google Cloud credentials exist; otherwise skip cleanly.
    if: ${{ needs.build.outputs.testlab_enabled == 'true' }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_RESULTS_BUCKET: ${{ vars.GCP_RESULTS_BUCKET }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download debug APK from build job
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug-apk

      - name: Authenticate to Google Cloud (OIDC / Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Run Robo test in Firebase Test Lab
        id: robo
        run: |
          set -euo pipefail
          APK="$(ls app-debug-apk/*.apk | head -n 1)"
          echo "Using APK: ${APK}"

          RESULTS_DIR="robo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "RESULTS_DIR=${RESULTS_DIR}" >> "$GITHUB_ENV"

          ARGS=(--project "${GCP_PROJECT_ID}"
                --app "${APK}"
                --type robo
                --device "model=MediumPhone.arm,version=35,locale=en,orientation=portrait"
                --timeout 3m
                --no-auto-google-login)

          if [ -n "${GCP_RESULTS_BUCKET}" ]; then
            BUCKET="${GCP_RESULTS_BUCKET#gs://}"
            ARGS+=(--results-bucket "${BUCKET}" --results-dir "${RESULTS_DIR}")
            echo "Results will be written to gs://${BUCKET}/${RESULTS_DIR}"
          else
            echo "::notice::GCP_RESULTS_BUCKET not set; gcloud will use its default results bucket."
          fi

          mkdir -p testlab-logs
          set +e
          gcloud firebase test android run "${ARGS[@]}" 2>&1 | tee testlab-logs/gcloud-testlab.log
          status=${PIPESTATUS[0]}
          set -e
          echo "TESTLAB_EXIT=${status}" >> "$GITHUB_ENV"
          # Non-zero exit from gcloud (test failure or execution error) fails this
          # step, and therefore the job and the workflow.
          exit "${status}"

      - name: Write Test Lab metadata (machine-readable)
        # Always run, even when earlier steps failed, so a run that fails before
        # the device test still produces an explicit (non-fabricated) record.
        if: always()
        run: |
          set -euo pipefail
          mkdir -p testlab-logs
          python3 - <<'PY'
          import datetime, json, os, re

          log_path = "testlab-logs/gcloud-testlab.log"
          exit_raw = os.environ.get("TESTLAB_EXIT", "").strip()

          def to_int(value):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return None

          meta = {
              "invoked": False,
              "matrixId": None,
              "testStarted": False,
              "testFinished": False,
              "roboPassed": False,
              "gcloudExitCode": to_int(exit_raw),
              "device": None,
              "runId": to_int(os.environ.get("GITHUB_RUN_ID", "")),
              "runAttempt": to_int(os.environ.get("GITHUB_RUN_ATTEMPT", "")),
              "logPresent": False,
              "recordedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "note": None,
          }

          try:
              with open(log_path, encoding="utf-8", errors="replace") as handle:
                  log = handle.read()
          except FileNotFoundError:
              meta["note"] = "gcloud-testlab.log not found; Test Lab step likely did not run."
          else:
              meta["logPresent"] = True
              meta["invoked"] = bool(
                  re.search(r"Uploading .* to Firebase Test Lab|Test \[matrix-|Firebase Test Lab will execute", log)
              )
              matrix = re.search(r"Test \[(matrix-[^\]]+)\]", log)
              if matrix:
                  meta["matrixId"] = matrix.group(1)
              meta["testStarted"] = bool(re.search(r"Test is Running|Starting attempt \d+", log))
              meta["testFinished"] = bool(re.search(r"Test is Finished|Robo testing complete", log))
              passed = re.search(r"│\s*Passed\s*│\s*([^│]+?)\s*│", log)
              failed = re.search(r"│\s*(Failed|Inconclusive|Flaky)\s*│\s*([^│]+?)\s*│", log)
              if passed:
                  meta["roboPassed"] = True
                  meta["device"] = passed.group(1).strip()
              elif failed:
                  meta["roboPassed"] = False
                  meta["device"] = failed.group(2).strip()
              if not meta["invoked"]:
                  meta["note"] = "Test Lab was not invoked (no upload/test markers in log)."
              elif not meta["testStarted"]:
                  meta["note"] = "Test Lab invoked but the device test never started."
              elif not meta["testFinished"]:
                  meta["note"] = "Test started but no completion marker found."

          with open("testlab-logs/testlab-meta.json", "w", encoding="utf-8") as out:
              json.dump(meta, out, indent=2, ensure_ascii=False)
              out.write("\n")
          print(json.dumps(meta, indent=2))
          PY

      - name: Download Test Lab raw results
        # Run even when the Robo step failed, so failure artifacts are captured.
        if: ${{ always() && env.GCP_RESULTS_BUCKET != '' }}
        run: |
          set -euo pipefail
          BUCKET="${GCP_RESULTS_BUCKET#gs://}"
          mkdir -p testlab-results
          gsutil -m cp -r "gs://${BUCKET}/${RESULTS_DIR}" ./testlab-results \
            || echo "::warning::Could not download raw results from gs://${BUCKET}/${RESULTS_DIR}"

      - name: Summarize Test Lab outcome
        if: always()
        run: |
          {
            echo "### Firebase Test Lab (Robo)"
            echo ""
            echo "- Project: \`${GCP_PROJECT_ID:-<unset>}\`"
            echo "- Device: \`model=MediumPhone.arm, version=35, locale=en, orientation=portrait\`"
            echo "- gcloud exit code: \`${TESTLAB_EXIT:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Lab logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-test-lab-results
          path: |
            testlab-logs/**
            testlab-results/**
          if-no-files-found: warn
          retention-days: 14
